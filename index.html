
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adityava Group | Official Website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <nav class="navbar">

        <a href="#home" class="brand">ADITYAVA GROUP</a>

        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#companies">Companies</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>

    </nav>

    <!-- HOMEPAGE -->
    <main class="homepage" id="home">

        <!-- HERO AREA -->
        <section class="hero-stage">

            <!-- LEFT SOLAR IMAGE -->
            <div class="side-image solar-image">
                <img
                    src="assets/solar-banner.png"
                    alt="Solar Energy Solutions">
            </div>

            <!-- CENTER GROUP LOGO -->
            <div class="group-section">
                <img
                    src="assets/adityava-group-logo.png"
                    alt="Adityava Group Logo"
                    class="group-logo">
            </div>

            <!-- RIGHT CCTV IMAGE -->
            <div class="side-image technology-image">
                <img
                    src="assets/cctv-technology.png"
                    alt="CCTV and Technology Solutions">
            </div>

        </section>

        <!-- COMPANY SECTION -->
        <section class="companies-section" id="companies">

            <div class="section-heading">
                <span></span>
                <h1>OUR COMPANIES</h1>
                <span></span>
            </div>

            <div class="company-logos">

                <div class="company-item">
                    <img
                        src="assets/greentech-logo.png"
                        alt="Adityava Greentech Solutions">
                </div>

                <div class="company-divider"></div>

                <div class="company-item">
                    <img
                        src="assets/technology-logo.png"
                        alt="Adityava Technology">
                </div>

            </div>

        </section>

    </main>

</body>
</html>
